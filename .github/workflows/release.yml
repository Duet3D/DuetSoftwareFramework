name: Publish .NET packages on GitHub and NuGet

on:
  release:
    types: [published]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7

      # Install .NET environment
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10

      # Build DSF
      - name: Build DSF packages
        run: |
          cd src
          dotnet restore
          dotnet build -c Release

      # Publish packages to the GitHub package registry
      - name: Publish packages on GitHub
        run: |
          dotnet nuget push src/DuetAPI/bin/Release/DuetAPI.*.nupkg --source "https://nuget.pkg.github.com/Duet3D/index.json" --api-key $GITHUB_TOKEN --skip-duplicate
          dotnet nuget push src/DuetAPIClient/bin/Release/DuetAPIClient.*.nupkg --source "https://nuget.pkg.github.com/Duet3D/index.json" --api-key $GITHUB_TOKEN --skip-duplicate
          dotnet nuget push src/DuetHttpClient/bin/Release/DuetHttpClient.*.nupkg --source "https://nuget.pkg.github.com/Duet3D/index.json" --api-key $GITHUB_TOKEN --skip-duplicate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Exchange the GitHub OIDC token for a temporary nuget.org API key. It is only valid for an
      # hour, so this must stay directly in front of the push step
      - name: Log in to NuGet
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: chrishamm

      # Publish packages to the NuGet package registry
      - name: Publish packages on NuGet
        run: |
          dotnet nuget push src/DuetAPI/bin/Release/DuetAPI.*.nupkg --source "https://api.nuget.org/v3/index.json" --api-key $NUGET_API_KEY --skip-duplicate
          dotnet nuget push src/DuetAPIClient/bin/Release/DuetAPIClient.*.nupkg --source "https://api.nuget.org/v3/index.json" --api-key $NUGET_API_KEY --skip-duplicate
          dotnet nuget push src/DuetHttpClient/bin/Release/DuetHttpClient.*.nupkg --source "https://api.nuget.org/v3/index.json" --api-key $NUGET_API_KEY --skip-duplicate
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}

  # Regenerate the docfx documentation and commit it back to the released branch on stable releases
  docs:
    if: github.event_name == 'release' && github.event.release.prerelease == false
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # The release ref is a tag and target_commitish may hold a commit SHA rather than a branch name, and
      # either one checks out a detached HEAD that cannot be pushed, so derive the branch from the tag
      - name: Resolve the release branch
        id: release-branch
        run: echo "name=${TAG%.*}-dev" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ github.event.release.tag_name }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.release-branch.outputs.name }}

      # Install .NET environment
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10

      # Install docfx
      - name: Install docfx
        run: dotnet tool install -g docfx

      # Regenerate the documentation into docs/. docfx reads API metadata from the built Release
      # assemblies and their XML doc files, so the projects must be built in Release first (the source
      # generators do not run under docfx's own Roslyn, which is why it cannot compile the projects itself)
      - name: Regenerate documentation
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet build -c Release src/DuetSoftwareFramework.sln
          docfx src/Documentation/docfx.json

      # Commit and push the regenerated documentation if anything changed
      - name: Commit documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "Documentation is already up to date"
          else
            git commit -m "Updated documentation"
            git push
          fi
