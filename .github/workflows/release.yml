name: Publish .NET packages on GitHub and NuGet

on:
  release:
    types: [published]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7

      # Install .NET environment
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10

      # Build DSF
      - name: Build DSF packages
        run: |
          cd src
          dotnet restore
          dotnet build

      # Publish packages
      - name: Publish packages
        run: |
          # Publish to GitHub package registry
          dotnet nuget push src/DuetAPI/bin/Debug/DuetAPI.*.nupkg --source "https://nuget.pkg.github.com/Duet3D/index.json" --api-key $GITHUB_TOKEN
          dotnet nuget push src/DuetAPIClient/bin/Debug/DuetAPIClient.*.nupkg --source "https://nuget.pkg.github.com/Duet3D/index.json" --api-key $GITHUB_TOKEN
          dotnet nuget push src/DuetHttpClient/bin/Debug/DuetHttpClient.*.nupkg --source "https://nuget.pkg.github.com/Duet3D/index.json" --api-key $GITHUB_TOKEN
          # Publish to NuGet package registry
          dotnet nuget push src/DuetAPI/bin/Debug/DuetAPI.*.nupkg --source "nuget.org" --api-key $NUGET_API_KEY
          dotnet nuget push src/DuetAPIClient/bin/Debug/DuetAPIClient.*.nupkg --source "nuget.org" --api-key $NUGET_API_KEY
          dotnet nuget push src/DuetHttpClient/bin/Debug/DuetHttpClient.*.nupkg --source "nuget.org" --api-key $NUGET_API_KEY
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

  # Regenerate the docfx documentation and commit it back to the released branch on stable releases
  docs:
    if: github.event_name == 'release' && github.event.release.prerelease == false
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # The release ref is a tag, so check out the branch it was cut from to push the docs back
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.target_commitish }}

      # Install .NET environment
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10

      # Install docfx
      - name: Install docfx
        run: dotnet tool install -g docfx

      # Regenerate the documentation into docs/. docfx reads API metadata from the built Release
      # assemblies and their XML doc files, so the projects must be built in Release first (the source
      # generators do not run under docfx's own Roslyn, which is why it cannot compile the projects itself)
      - name: Regenerate documentation
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet build -c Release src/DuetSoftwareFramework.sln
          docfx src/Documentation/docfx.json

      # Commit and push the regenerated documentation if anything changed
      - name: Commit documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "Documentation is already up to date"
          else
            git commit -m "Updated documentation"
            git push
          fi
