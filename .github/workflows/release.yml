name: Publish .NET packages on GitHub and NuGet

on:
  release:
    types: [published]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7

      # Install .NET environment
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8

      # Build DSF
      - name: Build DSF packages
        run: |
          cd src
          dotnet restore
          dotnet build -c Release

      # Publish packages to the GitHub package registry
      - name: Publish packages on GitHub
        run: |
          dotnet nuget push src/DuetAPI/bin/Release/DuetAPI.*.nupkg --source "https://nuget.pkg.github.com/Duet3D/index.json" --api-key $GITHUB_TOKEN --skip-duplicate
          dotnet nuget push src/DuetAPIClient/bin/Release/DuetAPIClient.*.nupkg --source "https://nuget.pkg.github.com/Duet3D/index.json" --api-key $GITHUB_TOKEN --skip-duplicate
          dotnet nuget push src/DuetHttpClient/bin/Release/DuetHttpClient.*.nupkg --source "https://nuget.pkg.github.com/Duet3D/index.json" --api-key $GITHUB_TOKEN --skip-duplicate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Exchange the GitHub OIDC token for a temporary nuget.org API key. It is only valid for an
      # hour, so this must stay directly in front of the push step
      - name: Log in to NuGet
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: chrishamm

      # Publish packages to the NuGet package registry
      - name: Publish packages on NuGet
        run: |
          dotnet nuget push src/DuetAPI/bin/Release/DuetAPI.*.nupkg --source "https://api.nuget.org/v3/index.json" --api-key $NUGET_API_KEY --skip-duplicate
          dotnet nuget push src/DuetAPIClient/bin/Release/DuetAPIClient.*.nupkg --source "https://api.nuget.org/v3/index.json" --api-key $NUGET_API_KEY --skip-duplicate
          dotnet nuget push src/DuetHttpClient/bin/Release/DuetHttpClient.*.nupkg --source "https://api.nuget.org/v3/index.json" --api-key $NUGET_API_KEY --skip-duplicate
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
