name: Build

on:
  push:
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Architecture passed to scripts/build.sh (--arch)
  ARCH: linux-arm64

jobs:
  # The devcontainer image carries the cross toolchains, CMake and the .NET SDK the build needs.
  # It is pushed to GHCR under a tag derived from its inputs, so it is only rebuilt when the
  # Dockerfile or the toolchain install script changes.
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v6

      - name: Compute image reference
        id: meta
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          tag="${{ hashFiles('.devcontainer/Dockerfile', 'scripts/install-arm-gcc.sh') }}"
          echo "image=ghcr.io/${repo}/devcontainer:${tag}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push devcontainer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      # The image is private to the repository, so the job needs credentials to pull it
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        # Built one project per job rather than with --all so they run in parallel.
        # DuetControlServer implicitly pulls in DuetSbcInterface (libduet_sbc.so).
        project:
          - DuetControlServer
          - DuetSbcInterface
          - DuetPiManagementPlugin
          - DuetPluginService
          - DuetWebServer
          - CodeConsole
          - CodeLogger
          - CodeStream
          - CustomHttpEndpoint
          - ModelObserver
          - PluginManager
    steps:
      - uses: actions/checkout@v6

      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build ${{ matrix.project }}
        run: ./scripts/build.sh --aot --arch "$ARCH" ${{ matrix.project }}

  test:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      # The image is private to the repository, so the job needs credentials to pull it
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # UnitTests.HttpClient talks to a real Duet/SBC at a hard-coded hostname, so it cannot run here
      - name: Run unit tests
        run: |
          dotnet test src/UnitTests/UnitTests.csproj -c Debug \
            --filter "FullyQualifiedName!~UnitTests.HttpClient" \
            --logger "trx;LogFileName=UnitTests.trx" --results-directory test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: test-results
