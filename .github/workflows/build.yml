name: Build and Test

on:
  push:
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The devcontainer image carries the cross toolchains, CMake and the .NET SDK the build needs.
  # It is pushed to GHCR under a tag derived from its inputs, so it is only rebuilt when the
  # Dockerfile or the toolchain install script changes.
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v6

      - name: Compute image reference
        id: meta
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          tag="${{ hashFiles('.devcontainer/Dockerfile', 'scripts/install-arm-gcc.sh') }}"
          echo "image=ghcr.io/${repo}/devcontainer:${tag}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push devcontainer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build:
    name: Build DSF (${{ matrix.arch }} ${{ matrix.mode }})
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      # The image is private to the repository, so the job needs credentials to pull it
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        # Every deployable architecture, each built both ways: Native AOT is what is shipped, the
        # plain runtime build is kept working as the fallback and for debugging.
        arch:
          - linux-arm64
          - linux-arm
          - linux-x64
        mode:
          - aot
          - runtime
    steps:
      - uses: actions/checkout@v6

      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory '*'

      # libduet_sbc.so compiles RRFLibraries for its host, so DuetSbcInterface needs that submodule
      # and DuetControlServer needs it too because it builds libduet_sbc.so in turn. Nothing else in
      # the matrix touches lib/, so the clone is skipped for the other projects.
      - name: Check out RRFLibraries
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --depth 1 lib/RRFLibraries

      - name: Build DSF (${{ matrix.arch }}, ${{ matrix.mode }})
        run: ./scripts/build.sh ${{ matrix.mode == 'aot' && '--aot' || '' }} --arch ${{ matrix.arch }} --all

  # Bare-metal DuetCANMaster firmware (arm-none-eabi), built through its CMake presets.
  # The per-board presets are built here so a break in any single board is visible on its own.
  firmware:
    name: Build DuetCANMaster firmware (${{ matrix.preset }})
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      # The image is private to the repository, so the job needs credentials to pull it
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: release
            configure: release
          - preset: Duet3_MB6HC
            configure: release
          - preset: Duet3_MB6XD
            configure: release
          - preset: debug
            configure: debug
          - preset: Duet3_MB6HC-debug
            configure: debug
          - preset: Duet3_MB6XD-debug
            configure: debug
    steps:
      - uses: actions/checkout@v6

      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory '*'

      # LIBRARIES_DIR points at lib/, so the firmware needs those submodules. They are recorded with
      # git@ URLs; rewriting to https lets the public repos be cloned without a key. Only
      # LibTinyusb's nested tinyusb is compiled, so the other nested submodules are left alone.
      - name: Check out firmware libraries
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --depth 1 lib
          git -C lib/LibTinyusb submodule update --init --depth 1 src/tinyusb

      - name: Configure (${{ matrix.configure }})
        working-directory: src/DuetCANMaster
        run: cmake --preset ${{ matrix.configure }}

      - name: Build ${{ matrix.preset }}
        working-directory: src/DuetCANMaster
        run: cmake --build --preset ${{ matrix.preset }} -j"$(nproc)"

  # Bare-metal Duet3Expansion firmware (arm-none-eabi), built through its own recursive Makefile.
  # All ten boards share the library builds, so they go in one make invocation rather than a matrix.
  expansion-firmware:
    name: Build Duet3Expansion firmware
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      # The image is private to the repository, so the job needs credentials to pull it
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory '*'

      # The firmware itself is a submodule, and LIBRARIES_DIR points at lib/ so the boards link
      # against the same libraries as the rest of the tree. Only these five are compiled.
      - name: Check out the firmware and its libraries
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --depth 1 src/Duet3Expansion \
            lib/CANlib lib/CoreN2G lib/FreeRTOS lib/RRFLibraries lib/Qfplib-M0-full

      - name: Build every expansion board
        run: make Duet3Expansion -j"$(nproc)"

      # Puts each board's flash and RAM headroom on the run's summary page, so a change that eats
      # into a board's budget is visible without downloading anything.
      - name: Report firmware memory usage
        run: |
          ./scripts/expansion-memory-report.py
          ./scripts/expansion-memory-report.py --markdown >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Run unit tests
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      # The image is private to the repository, so the job needs credentials to pull it
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory '*'

      # The generated CAN message formats are checked in, so neither build depends on the generator.
      # That also means a schema edited without re-running it would ship silently, hence this check.
      - name: Check that the generated CAN message formats are up to date
        run: make can-messages-check

      # can-messages-verify compiles the layout probe against CANlib's own header, which is the only
      # check that the schema still describes the real message formats rather than merely being
      # self-consistent. It needs these three submodules and a host compiler.
      - name: Check out the CAN libraries
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --depth 1 lib/CANlib lib/RRFLibraries lib/CoreN2G

      - name: Verify the CAN message layouts against CANlib
        run: make can-messages-verify

      # Runs the tests with coverage and writes both UnitTests.trx and coverage.cobertura.xml into
      # test-results, which is uploaded below. The RequiresMachine category, which needs a real
      # Duet/SBC over HTTP, is excluded by the script.
      - name: Run C# unit tests with coverage
        run: ./scripts/coverage.sh --results-dir test-results | tee coverage.log
      
      # The script names each test as it starts and lists the failed names once the run is over,
      # which is what makes a failure findable in a log this long, and writes SystemTests.trx beside
      # the unit test results for the upload below. --all runs the same set the bare 'dotnet test'
      # this replaced ran, the KnownGap scenarios included, so this step still gates on what it did.
      - name: Run C# system tests
        run: ./scripts/system-tests.sh --all --results-dir test-results

      # Surfaces the per-assembly table on the run's summary page so a coverage change is visible
      # without opening the log or downloading the artifact.
      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo '### Code coverage'
            echo '```'
            sed -n '/^=== Coverage ===$/,$p' coverage.log || echo 'No coverage summary produced'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The DuetSbcInterface tests are host-side and only get built when not cross-compiling, so
      # they run through the native preset rather than the arm64 one the deployable .so uses.
      # The whole preset is built rather than named targets, so a test added later is run here
      # without this step having to be edited.
      - name: Build and run DuetSbcInterface tests
        working-directory: src/DuetSbcInterface
        run: |
          cmake --preset native
          cmake --build --preset native -j"$(nproc)"
          ctest --test-dir build/native --output-on-failure

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: test-results
