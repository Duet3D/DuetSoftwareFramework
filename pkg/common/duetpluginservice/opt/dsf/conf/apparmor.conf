#include <tunables/global>

{pluginDirectory}/** {
  #include <abstractions/base>
  #include <abstractions/bash>
  #include <abstractions/python>
  #include <abstractions/user-tmp>
{includes}

  /dev/tty rw,
  /etc/ssl/** r,
  /usr/bin/python{2.[4-7],3,3.[0-9]+} rix,
  /usr/local/lib{,32,64}/python{2.[4-7],3,3.[0-9]}/{site,dist}-packages/** r,
  /opt/vc/lib/** rm,

  capability dac_override,
  capability dac_read_search,
  capability sys_nice,

  # Only allow signalling self and same-profile peers (direct children that inherited this profile) - prevents a
  # plugin from SIGKILLing DCS, DPS, or other plugins
  signal (send) peer=@{profile_name},

  /opt/dsf/bin/* rm,
  owner {pluginDirectory}/ r,
  owner {pluginDirectory}/** rwmlk,
  owner /proc/@{pid}/** rw,
  /sys/** r,
  /{,var/}run/dsf/** rw,

{rules}
}
