# Basic 3 axis single tool FDM machine config
name: basic-3axis-machine
boards:
  1: EXP3HC
  123: EXP1HCL
  121: TOOL1RR
config: |
  ; General
  G90 ; absolute coordinates
  M83 ; relative extruder moves

  ; Smart Drivers
  M569 P1.0 S1 D2 ; driver 1.0 goes forwards (X axis)
  M569 P1.1 S1 D2 ; driver 1.1 goes forwards (Y axis)
  M569 P1.2 S1 D2 ; driver 1.2 goes forwards (Z axis)
  M569 P121.0 S1 D2 ; driver 121.0 goes forwards (extruder 0)

  ; Motor Idle Current Reduction
  M906 I30 T30 ; set motor current idle factor and idle timeout

  ; Axes
  M584 X1.0 Y1.1 Z1.2 ; set axis mapping
  M350 X16 Y16 Z16 I1 ; configure microstepping with interpolation
  M906 X800 Y800 Z800 ; set axis driver currents
  M92 X80 Y80 Z400 ; configure steps per mm
  M208 X0:200 Y0:200 Z0:200 ; set minimum and maximum axis limits
  M566 X900 Y900 Z12 ; set maximum instantaneous speed changes (mm/min)
  M203 X6000 Y6000 Z180 ; set maximum speeds (mm/min)
  M201 X500 Y500 Z20 ; set accelerations (mm/s^2)

  ; Extruders
  M584 E121.0 ; set extruder mapping
  M350 E16 I1 ; configure microstepping with interpolation
  M906 E1000 ; set extruder driver currents
  M92 E420 ; configure steps per mm
  M566 E120 ; set maximum instantaneous speed changes (mm/min)
  M203 E3600 ; set maximum speeds (mm/min)
  M201 E250 ; set accelerations (mm/s^2)

  ; Kinematics
  M669 K0 ; configure Cartesian kinematics

  ; Probes
  M558 K0 P8 C"1.io2.in" H5 F120 T6000 ; configure unfiltered digital probe via slot #0
  G31 K0 P500 X0 Y0 Z0.7 ; set Z probe trigger value, offset and trigger height

  ; Endstops
  M574 X1 P"1.io0.in" S1 ; configure X axis endstop
  M574 Y1 P"1.io1.in" S1 ; configure Y axis endstop
  M574 Z1 S2 ; configure Z axis endstop

  ; Sensors
  M308 S0 P"1.temp0" Y"thermistor" A"Heated Bed" T100000 B4725 C7.06e-8 ; configure sensor #0
  M308 S1 P"1.temp1" Y"thermistor" A"Nozzle" T100000 B4725 C7.06e-8 ; configure sensor #1

  ; Heaters
  M950 H0 C"1.out0" T0 ; create heater #0
  M143 H0 P0 T0 C0 S140 A0 ; configure heater monitor #0 for heater #0
  M307 H0 R2.43 D5.5 E1.35 K0.56 B1 ; configure model of heater #0
  M950 H1 C"1.out1" T1 ; create heater #1
  M143 H1 P0 T1 C0 S285 A0 ; configure heater monitor #0 for heater #1
  M307 H1 R2.43 D5.5 E1.35 K0.56 B0 ; configure model of heater #1

  ; Heated beds
  M140 P0 H0 ; configure heated bed #0

  ; Fans
  M950 F0 C"1.out3" ; create fan #0
  M106 P0 S0 L0 X1 B0.1 ; configure fan #0
  M950 F1 C"1.out4" ; create fan #1
  M106 P1 S0 X1 B0.1 H1 T45 ; configure fan #1

  ; Tools
  M563 P0 D0 H1 F0 ; create tool #0
  M568 P0 R0 S0 ; set initial tool #0 active and standby temperatures to 0C

  ; Miscellaneous
  T0 ; select first tool
